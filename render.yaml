services:
  # ============================================================================
  # GraphMind AI — Unified Web Service (Streamlit UI + FastAPI Backend)
  # Recommended: Runs both the backend API and frontend UI in 1 Render service
  # ============================================================================
  - type: web
    name: graphmind-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: GRAPHMIND_MODEL
        value: gemini-2.5-flash
      - key: FALKORDB_URL
        sync: false
      - key: FALKORDB_GRAPH
        value: graphmind
      - key: AUTO_SEED
        value: "true"

